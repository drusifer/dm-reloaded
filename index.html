<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Master (Amiga 1988 Recreation)</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at center, #14141b 0%, #050507 100%);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: #d4d4dc;
      }
      #monitor-stage {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      #amiga-screen {
        display: block;
        background: #000000;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.85), 0 0 0 2px #262630;
        cursor: crosshair;
      }

      /* Paula SFX Soundboard Overlay */
      #sfx-board-toggle {
        position: fixed;
        bottom: 12px;
        right: 14px;
        z-index: 30;
        background: #1a212b;
        color: #8cf5b2;
        border: 1px solid #355846;
        padding: 6px 11px;
        font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
        cursor: pointer;
        border-radius: 3px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.65);
      }
      #sfx-board-toggle:hover,
      #sfx-board-toggle.open {
        background: #23382c;
        border-color: #4ee38b;
      }
      #sfx-board-panel {
        position: fixed;
        top: 16px;
        right: 16px;
        bottom: 48px;
        width: min(680px, calc(100vw - 32px));
        z-index: 40;
        background: rgba(13, 16, 22, 0.96);
        border: 1px solid #3a4659;
        border-radius: 5px;
        box-shadow: 0 22px 64px rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font-size: 12px;
      }
      #sfx-board-panel[hidden] {
        display: none;
      }
      .sfx-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        background: #161c26;
        border-bottom: 1px solid #2a3444;
      }
      .sfx-sub {
        color: #8f9bb0;
        font-size: 11px;
        margin-top: 2px;
      }
      .sfx-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .sfx-btn,
      .sfx-btn-mini,
      .sfx-play-btn {
        background: #222b38;
        color: #dce4f2;
        border: 1px solid #3d4d63;
        padding: 5px 9px;
        border-radius: 3px;
        font: inherit;
        cursor: pointer;
      }
      .sfx-btn:hover,
      .sfx-btn-mini:hover,
      .sfx-play-btn:hover {
        background: #2e3b4e;
      }
      .sfx-btn-accent {
        background: #1d402c;
        border-color: #3da869;
        color: #a9f9c6;
      }
      .sfx-btn-mini {
        padding: 3px 7px;
        font-size: 11px;
      }
      .sfx-btn-mini.active {
        background: #2b593f;
        border-color: #53dc8b;
        color: #ffffff;
      }
      .sfx-controls-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 12px;
        background: #121720;
        border-bottom: 1px solid #252e3d;
        flex-wrap: wrap;
      }
      .sfx-inline-control {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        color: #b7c3d6;
      }
      .sfx-cue-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 6px;
        padding: 8px 12px;
        background: #10151d;
        border-bottom: 1px solid #252e3d;
      }
      .sfx-cue-chip {
        display: flex;
        align-items: center;
        gap: 5px;
        background: #18202c;
        border: 1px solid #2b374b;
        padding: 4px 6px;
        border-radius: 3px;
      }
      .sfx-cue-name {
        font-size: 10px;
        font-weight: 700;
        color: #84c5ff;
        min-width: 78px;
      }
      .sfx-select {
        background: #0d1219;
        color: #dce4f2;
        border: 1px solid #334257;
        border-radius: 2px;
        padding: 3px 4px;
        font: inherit;
        font-size: 11px;
        min-width: 0;
        flex: 1;
      }
      .sfx-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .sfx-row {
        display: grid;
        grid-template-columns: 64px 108px 104px 1fr 126px;
        align-items: center;
        gap: 7px;
        padding: 4px 6px;
        background: #151b24;
        border: 1px solid #242e3d;
        border-radius: 3px;
      }
      .sfx-play-btn {
        font-weight: 700;
        color: #8cf5b2;
        border-color: #336247;
        padding: 5px 6px;
        text-align: center;
      }
      .sfx-meta {
        display: flex;
        flex-direction: column;
        font-size: 10px;
        color: #8e9cb2;
        line-height: 1.25;
      }
      .sfx-slot {
        color: #f4ca64;
        font-weight: 700;
      }
      .sfx-wave {
        border: 1px solid #263545;
        border-radius: 2px;
        cursor: pointer;
      }
      .sfx-label-input {
        user-select: text;
        -webkit-user-select: text;
        background: #0b0f15;
        color: #eef3fb;
        border: 1px solid #324156;
        border-radius: 2px;
        padding: 4px 7px;
        font: inherit;
        font-size: 11px;
        width: 100%;
      }
      .sfx-label-input:focus {
        outline: none;
        border-color: #56c2ff;
      }
      .sfx-empty {
        padding: 16px;
        color: #9aa6ba;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main id="monitor-stage">
      <canvas
        id="amiga-screen"
        width="320"
        height="200"
        aria-label="Dungeon Master 320x200 Amiga Viewport"
      ></canvas>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
